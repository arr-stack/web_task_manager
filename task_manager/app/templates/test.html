<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title> TEST</title>
</head>
<body>
    <header><h1>Welcome to Task Manager!</h1></header>
    <br>
    <form action='test/add' method="post">
        <label for="task_1">Task name</label>
        <input id="task_1" type='text' name="task">
        <label for="check_1"></label>
        <input type="hidden" name="check" value=false>
        <input type="checkbox" id="check_1" name="check" value=true>
        <button type="submit">Submit</button>
    </form>
    <main>
        {% for task in tasks %}
    <ul>
        <li>
            <span>{{ task.task }}</span>
            <form action="test/check" method="post">
                <label for="check_{{ task.id }}"></label>
                <input type="checkbox" id="check_{{ task.id }}" name="task_id" value="{{ task.id }}" {% if task.completed %}checked{% endif %}
                onChange="this.form.submit()">
            </form>
            <form action='test/delete' method="post">
                <button type="submit">DELETE</button>
                <input type="hidden" name='task_id' value="{{ task.id }}">
            </form>
        </li>
    </ul>
     {% endfor %}
    </main>

</body>
</html>
